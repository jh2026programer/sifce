# nginx del servicio "web": sirve la interfaz y reenvía /api/ a la API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hojas de vida de hasta 5 MB (RF07) + margen.
    client_max_body_size 6m;

    # DNS interno de Docker: "api" es el servicio de la API en el stack. Con
    # la variable, nginx arranca aunque la API aún no esté lista y Swarm
    # reparte cada petición entre las réplicas de la API.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: cualquier ruta de la interfaz devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden cachear.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
