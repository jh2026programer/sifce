# =====================================================================
# SIFCE en Docker Swarm (ciclo de vida, etapa 6 · DEPLOY)
#
# Se despliega con deploy/deploy.ps1, que construye las imágenes, crea los
# secretos y ejecuta:
#   docker stack deploy -c deploy/docker-stack.yml sifce
#
# Publica: web (8080) y las herramientas de operación Grafana (3000),
# Prometheus (9090) y Alertmanager (9093). La API y la base de datos quedan
# en la red interna del stack, inaccesibles desde fuera.
#
# Configs y secretos llevan en el nombre una huella de su contenido
# (${...}_HASH, calculada por deploy.ps1): en Swarm no se pueden modificar,
# así que cada cambio crea una versión nueva en vez de chocar con la anterior.
# =====================================================================
version: "3.8"

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: sifce
  DB_USER: sifce
  DB_PASSWORD_FILE: /run/secrets/sifce_db_password

services:
  # --- MODEL: PostgreSQL --------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sifce
      POSTGRES_USER: sifce
      POSTGRES_PASSWORD_FILE: /run/secrets/sifce_db_password
    secrets:
      - sifce_db_password
    configs:
      # Con el volumen vacío, PostgreSQL ejecuta este archivo al iniciar:
      # crea todas las tablas de model/schema.sql.
      - source: sifce_schema
        target: /docker-entrypoint-initdb.d/01-schema.sql
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifce -d sifce"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # --- Carga de datos demo (se ejecuta, termina y no se reinicia) --------
  seed:
    image: sifce-api:${SIFCE_API_TAG:?ejecuta deploy/deploy.ps1}
    command: ["node", "model/scripts/seed.js"]
    environment:
      <<: *db-env
      AI_PROVIDER: mock
    secrets:
      - sifce_db_password
    volumes:
      - uploads:/data/uploads
    deploy:
      # Tarea de una sola vez (Swarm "job"): corre hasta terminar bien y no se
      # vuelve a levantar. El seed es idempotente: no duplica datos.
      mode: replicated-job
      restart_policy:
        # Reintenta mientras la base aún no esté lista (creando las tablas).
        condition: on-failure
        delay: 5s
        max_attempts: 15

  # --- WHATEVER: API Express (2 réplicas) ---------------------------------
  api:
    image: sifce-api:${SIFCE_API_TAG:?ejecuta deploy/deploy.ps1}
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET_FILE: /run/secrets/sifce_jwt_secret
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY_FILE: /run/secrets/sifce_ai_api_key
      # Microservicios: corren FUERA de Docker, como programas en el PC
      # ("npm run microservicios"). host.docker.internal es el PC visto desde
      # el contenedor. Si no están encendidos, la API usa su respaldo interno.
      MS_COMPATIBILIDAD_URL: http://host.docker.internal:4101
      MS_VALIDADOR_CV_URL: http://host.docker.internal:4102
      MS_TIMEOUT_MS: "3000"
      # MONITOR (etapa 8): New Relic APM; sin clave el agente no se activa.
      NEW_RELIC_LICENSE_KEY_FILE: /run/secrets/sifce_newrelic_license_key
      NEW_RELIC_APP_NAME: SIFCE (Docker Swarm)
    secrets:
      - sifce_db_password
      - sifce_jwt_secret
      - sifce_ai_api_key
      - sifce_newrelic_license_key
    volumes:
      - uploads:/data/uploads
    deploy:
      replicas: 2
      update_config:
        # Actualizaciones sin caída: reemplaza una réplica a la vez y arranca
        # la nueva antes de apagar la vieja.
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  # --- VIEW: interfaz React servida por nginx -----------------------------
  web:
    image: sifce-web:${SIFCE_WEB_TAG:?ejecuta deploy/deploy.ps1}
    ports:
      - "8080:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # =========================================================================
  # OPERATE (etapa 7): monitoreo, alertas y paneles
  # =========================================================================

  # Recoge las métricas de cada réplica de la API (/metrics) y evalúa las
  # reglas de alerta de deploy/monitoring/alert-rules.yml.
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/alert-rules.yml
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Recibe las alertas de Prometheus y abre/cierra incidentes en PagerDuty.
  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - sifce_pagerduty_routing_key
    ports:
      - "9093:9093"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Panel "SIFCE · Operación" (lectura sin iniciar sesión; el admin usa el
  # secreto sifce_grafana_admin_password, guardado en deploy/.grafana-admin.txt).
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/sifce_grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sifce-operacion.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets:
      - sifce_grafana_admin_password
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/sifce.yml
      - source: grafana_dashboard_operacion
        target: /etc/grafana/dashboards/sifce-operacion.json
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

secrets:
  sifce_db_password:
    external: true
  sifce_jwt_secret:
    external: true
  sifce_ai_api_key:
    external: true
    name: ${SIFCE_AI_SECRET:?ejecuta deploy/deploy.ps1}
  sifce_pagerduty_routing_key:
    external: true
    name: ${SIFCE_PAGERDUTY_SECRET:?ejecuta deploy/deploy.ps1}
  sifce_grafana_admin_password:
    external: true
  sifce_newrelic_license_key:
    external: true
    name: ${SIFCE_NEWRELIC_SECRET:?ejecuta deploy/deploy.ps1}

configs:
  sifce_schema:
    name: sifce_schema_${SIFCE_SCHEMA_HASH:?ejecuta deploy/deploy.ps1}
    file: ../model/schema.sql
  prometheus_config:
    name: sifce_prometheus_${SIFCE_PROMETHEUS_HASH:?ejecuta deploy/deploy.ps1}
    file: ./monitoring/prometheus.yml
  prometheus_rules:
    name: sifce_alert_rules_${SIFCE_RULES_HASH:?ejecuta deploy/deploy.ps1}
    file: ./monitoring/alert-rules.yml
  alertmanager_config:
    name: sifce_alertmanager_${SIFCE_ALERTMANAGER_HASH:?ejecuta deploy/deploy.ps1}
    file: ./monitoring/${SIFCE_ALERTMANAGER_FILE:?ejecuta deploy/deploy.ps1}
  grafana_datasource:
    name: sifce_grafana_ds_${SIFCE_GRAFANA_DS_HASH:?ejecuta deploy/deploy.ps1}
    file: ./monitoring/grafana-datasource.yml
  grafana_dashboards_provider:
    name: sifce_grafana_prov_${SIFCE_GRAFANA_PROV_HASH:?ejecuta deploy/deploy.ps1}
    file: ./monitoring/grafana-dashboards.yml
  grafana_dashboard_operacion:
    name: sifce_grafana_dash_${SIFCE_GRAFANA_DASH_HASH:?ejecuta deploy/deploy.ps1}
    file: ./monitoring/dashboards/sifce-operacion.json

volumes:
  db-data:
  uploads:
  prometheus-data:
  grafana-data:
