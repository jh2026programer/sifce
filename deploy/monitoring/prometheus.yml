# Prometheus de SIFCE (ciclo de vida, etapa 7 · OPERATE)
# Recoge las métricas de cada réplica de la API y evalúa las reglas de alerta.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    sistema: sifce

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # "tasks.api" es el DNS interno de Swarm que devuelve la IP de CADA réplica
  # de la API: así Prometheus vigila las réplicas por separado y detecta si
  # una sola se cae aunque el servicio siga respondiendo.
  - job_name: sifce-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["tasks.api"]
        type: A
        port: 4000
        refresh_interval: 5s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
