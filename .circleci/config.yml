# =====================================================================
# SIFCE - Integración continua en CircleCI
#
# Cada vez que se sube código a GitHub se ejecuta el flujo "build-y-pruebas":
#
#   build  (ciclo de vida, etapa 3 · BUILD)
#     instala dependencias, revisa la sintaxis de model/ y whatever/,
#     verifica que la API carga y compila view/ para producción.
#
#   test   (ciclo de vida, etapa 4 · TEST) — solo si build pasó
#     levanta una base PostgreSQL temporal, crea las tablas, carga los datos
#     demo y corre las pruebas automáticas (Jest + Supertest) contra la API.
#     Los resultados se publican en la pestaña "Tests" de CircleCI.
#
# Si cualquier paso falla, el commit queda marcado con ❌ en GitHub.
# =====================================================================
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:lts
    working_directory: ~/sifce

  node-con-postgres:
    docker:
      - image: cimg/node:lts
        environment:
          # Base temporal de CI: se crea vacía en cada ejecución y se destruye al final.
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sifce_ci
          DB_USER: sifce
          DB_PASSWORD: sifce_ci
          JWT_SECRET: solo-para-pruebas-de-ci
      - image: cimg/postgres:16.9
        environment:
          POSTGRES_USER: sifce
          POSTGRES_PASSWORD: sifce_ci
          POSTGRES_DB: sifce_ci
    working_directory: ~/sifce

commands:
  instalar-dependencias:
    steps:
      - restore_cache:
          name: Restaurar dependencias en caché
          keys:
            - deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Instalar dependencias (model, whatever, view)
          command: npm ci --no-audit --no-fund
      - save_cache:
          name: Guardar dependencias en caché
          key: deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  build:
    executor: node
    steps:
      - checkout
      - instalar-dependencias

      - run:
          name: Revisar sintaxis de la API y los modelos
          command: |
            find model whatever -name "*.js" -not -path "*/node_modules/*" -print0 \
              | xargs -0 -n1 node --check
            echo "Sintaxis correcta en model/ y whatever/"

      - run:
          name: Verificar que la API carga completa
          command: node -e "require('./whatever/routes'); console.log('API cargada sin errores')"

      - run:
          name: Compilar la interfaz (view)
          command: npm run build:web
          environment:
            # Dirección de la API que queda grabada en la interfaz al compilar.
            # localhost para que el artefacto funcione junto a sifce-api.zip en
            # un equipo local; en DEPLOY se recompila con la URL del servidor.
            VITE_API_URL: http://localhost:4000/api/v1

      # Artefactos del build (el equivalente a un .jar en Java):
      #   sifce-web.zip -> interfaz compilada, lista para un servidor web
      #   sifce-api.zip -> API (whatever/) + modelos (model/) con su lockfile,
      #                    lista para "npm ci --omit=dev" y "npm run start:api"
      - run:
          name: Empaquetar artefactos (sifce-web.zip y sifce-api.zip)
          command: |
            mkdir -p artifacts
            (cd view/dist && zip -qr ../../artifacts/sifce-web.zip .)
            git archive --format=zip -o artifacts/sifce-api.zip HEAD \
              model whatever view/package.json package.json package-lock.json README.md .env.example
            ls -lh artifacts

      - store_artifacts:
          path: artifacts
          destination: entregables

  test:
    executor: node-con-postgres
    steps:
      - checkout
      - instalar-dependencias

      - run:
          name: Esperar a que PostgreSQL esté listo
          command: dockerize -wait tcp://localhost:5432 -timeout 1m

      - run:
          name: Pruebas automáticas (Jest + Supertest)
          command: npm test

      - store_test_results:
          path: whatever/reports

      - store_artifacts:
          path: whatever/reports
          destination: reportes-de-pruebas

workflows:
  build-y-pruebas:
    jobs:
      - build
      - test:
          requires:
            - build
