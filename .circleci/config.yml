# =====================================================================
# SIFCE - Integración continua (ciclo de vida: etapa 3 · BUILD)
#
# Cada vez que se sube código a GitHub, CircleCI:
#   1. descarga el repositorio,
#   2. instala las dependencias de model/, whatever/ y view/ (npm workspaces),
#   3. verifica que todo el código de la API y de los modelos sea JavaScript válido
#      y que la API cargue completa (rutas, controladores, modelos),
#   4. compila la interfaz de React (view/) para producción,
#   5. guarda el build como artefacto descargable.
# Si cualquier paso falla, el commit queda marcado con ❌ en GitHub.
# =====================================================================
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:lts
    working_directory: ~/sifce

jobs:
  build:
    executor: node
    steps:
      - checkout

      - restore_cache:
          name: Restaurar dependencias en caché
          keys:
            - deps-v1-{{ checksum "package-lock.json" }}

      - run:
          name: Instalar dependencias (model, whatever, view)
          command: npm ci --no-audit --no-fund

      - save_cache:
          name: Guardar dependencias en caché
          key: deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Revisar sintaxis de la API y los modelos
          command: |
            find model whatever -name "*.js" -not -path "*/node_modules/*" -print0 \
              | xargs -0 -n1 node --check
            echo "Sintaxis correcta en model/ y whatever/"

      - run:
          name: Verificar que la API carga completa
          command: node -e "require('./whatever/routes'); console.log('API cargada sin errores')"

      - run:
          name: Compilar la interfaz (view)
          command: npm run build:web
          environment:
            VITE_API_URL: https://api.sifce.example/api/v1

      - store_artifacts:
          path: view/dist
          destination: view-dist

workflows:
  build:
    jobs:
      - build
